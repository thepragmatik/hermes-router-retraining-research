name: Deploy research site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          set -euo pipefail
          mkdir -p _site/memo _site/evidence _site/experiments _site/designs
          cp site/index.html site/styles.css _site/
          cp memo/*.md _site/memo/
          cp evidence/*.md _site/evidence/
          cp experiments/*.md _site/experiments/
          cp designs/*.md _site/designs/
          cp LICENSE README.md AGENTS.md RESEARCH_SIGNOFF.md DATASETS.md MISSION_DESIGN_REVIEW.md PIVOT_EXECUTION_PLAN.md research-manifest.json _site/
          test -s _site/index.html
          test -s _site/AGENTS.md
          test -s _site/DATASETS.md
          test -s _site/PIVOT_EXECUTION_PLAN.md
          test -s _site/memo/2026-09-06_pivot-stackable-gains.md
          test -s _site/evidence/pivot-source-ledger.md
          test -s _site/evidence/pivot-adversarial-notes.md
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
